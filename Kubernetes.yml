apiVersion: v1
kind: Service
metadata:
  name: expensecd f-service
spec:
  type: NodePort
  selector:
    app: expense
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
kind: Deployment
metadata:
  name: expense-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expense
  template:
    metadata:
      labels:
        app: expense
    spec:
      containers:
        - name: expense
          image: ghcr.io/ahmedkhafagy6/expense-tracker:latest
          ports:
            - containerPort: 5000